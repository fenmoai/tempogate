apiVersion: v1
kind: Service
metadata:
  name: {{ include "tempogate.fullname" . }}
  labels:
    {{- include "tempogate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Single listener: public OIDC/OAuth2 surface + /healthz + /readyz.
    # A dedicated admin port is planned upstream; a second entry lands
    # here when the binary grows one.
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tempogate.selectorLabels" . | nindent 4 }}
